# nginx.conf: proxy for www.jackyplayhouse.simdif.com

user  nobody;
worker_processes  1;

#error_log   /usr/local/var/log/nginx/error.log  notice;

events {
    worker_connections  1024;
}

http {

    #
    # The backend is behind Cloudflare, so nginx must resolve the hostname
    # itself at runtime. Use your system resolvers or public ones.
    #
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 5s;

    #
    # Internal hostname (what Cloudflare/GHE pattern called the private host)
    # and the public hostname your users will actually visit.
    #
    # Replace public-proxy.yourdomain.com with the name YOU serve this proxy on.
    #
    map $http_host $backend_hostname {
        default "www.jackyplayhouse.simdif.com";
    }
    map $http_host $backend_baseurl {
        default "https://$backend_hostname";
    }
    map $http_host $public_hostname {
        default "public-proxy.yourdomain.com";
    }

    #
    # Rewrite referer request header
    #
    map $http_referer $new_referer {
        default $http_referer;
    }

    #
    # The Cloudflare IPs shown by dig for the backend.
    # Cloudflare rotates these often; the resolver handles that, keep this
    # map only if you prefer pinning (not recommended).
    #
    map $remote_addr $is_atlassian_ip {
        default 0;
        "~^104\.192\.138\.(24[0-9]|25[0-5])$" 1;
        "~^13\.52\.5\.(9[6-9]|1[01][0-9]|12[0-7])$" 1;
    }

    server {
        listen 0.0.0.0:443 ssl;
        listen [::]:443 ssl;
        server_name public-proxy.yourdomain.com;

        #
        # TODO: SSL certificate for public-proxy.yourdomain.com
        # ssl_certificate     /path/fullchain.pem;
        # ssl_certificate_key /path/privkey.pem;

        location / {

            #
            # Critical when proxying a Cloudflare-fronted site:
            # send the right Host and SNI, or Cloudflare returns
            # 409 / 526 / wrong-site responses.
            #
            proxy_set_header Host $backend_hostname;
            proxy_set_header Referer $new_referer;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_ssl_server_name on;
            proxy_ssl_name $backend_hostname;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Accept-Encoding "";

            proxy_redirect ~^(https://$backend_hostname)(/.*)?$ https://$public_hostname$2;

            #
            # Rewrite response headers
            #
            header_filter_by_lua_block {
                local headers = ngx.resp.get_headers()
                local backend_hostname = "www.jackyplayhouse.simdif.com"
                local public_hostname = ngx.var.public_hostname

                for header_name, header_value in pairs(headers) do
                    if type(header_value) == "table" then
                        for i, value in ipairs(header_value) do
                            header_value[i] = string.gsub(header_value[i], backend_hostname, public_hostname)
                        end
                    elseif type(header_value) == "string" then
                        header_value = string.gsub(header_value, backend_hostname, public_hostname)
                    end
                    ngx.header[header_name] = header_value
                end
            }

            #
            # Rewrite response content
            #
            sub_filter "www.jackyplayhouse.simdif.com" "$public_hostname";
            sub_filter_once off;

            #
            # Access is OPEN to everyone ("all turned on").
            # The IP whitelist, Atlassian check, and API-key gate were removed.
            # To re-add protection later, restore any of:
            #
            #   if ($remote_addr !~ "^(192\.168\.0\.)") {
            #       return 403 "Not allowed";
            #   }
            #   if ($http_x_mysecretheader != "MY_API_KEY") {
            #       return 401 "Not allowed";
            #   }
            #
            proxy_pass $backend_baseurl;
        }
    }
}
